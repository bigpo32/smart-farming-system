<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Farming System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🌾 Smart Farming Dashboard</h1>
    <p>Monitor your farm in real time</p>
  </header>

  <section class="container">

    <div class="card">
      <h2>🌱 Soil Moisture</h2>
      <p>65% - Good</p>
    </div>

    <div class="card">
      <h2>🌡️ Temperature</h2>
      <p>28°C - Normal</p>
    </div>

    <div class="card">
      <h2>💧 Water Level</h2>
      <p>40% - Needs attention</p>
    </div>

    <div class="card">
      <h2>🌦️ Weather Status</h2>
      <p>Sunny</p>
    </div>

  </section>

  <footer>
    <p>Smart Farming System © 2026</p>
  </footer>

</body>
</html>
